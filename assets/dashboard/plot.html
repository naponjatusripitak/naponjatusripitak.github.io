        'พระนครศรีอยุธยา': 'Phra Nakhon Si Ayutthaya', 'พะเยา': 'Phayao', 'พังงา': 'Phang Nga', 'พัทลุง': 'Phatthalung',
        'พิจิตร': 'Phichit', 'พิษณุโลก': 'Phitsanulok', 'เพชรบุรี': 'Phetchaburi', 'เพชรบูรณ์': 'Phetchabun',
        'แพร่': 'Phrae', 'ภูเก็ต': 'Phuket', 'มหาสารคาม': 'Maha Sarakham', 'มุกดาหาร': 'Mukdahan',
        'แม่ฮ่องสอน': 'Mae Hong Son', 'ยโสธร': 'Yasothon', 'ยะลา': 'Yala', 'ร้อยเอ็ด': 'Roi Et',
        'ระนอง': 'Ranong', 'ระยอง': 'Rayong', 'ราชบุรี': 'Ratchaburi', 'ลพบุรี': 'Lopburi',
        'ลำปาง': 'Lampang', 'ลำพูน': 'Lamphun', 'เลย': 'Loei', 'ศรีสะเกษ': 'Si Sa Ket',
        'สกลนคร': 'Sakon Nakhon', 'สงขลา': 'Songkhla', 'สตูล': 'Satun', 'สมุทรปราการ': 'Samut Prakan',
        'สมุทรสงคราม': 'Samut Songkhram', 'สมุทรสาคร': 'Samut Sakhon', 'สระแก้ว': 'Sa Kaeo',
        'สระบุรี': 'Saraburi', 'สิงห์บุรี': 'Sing Buri', 'สุโขทัย': 'Sukhothai', 'สุพรรณบุรี': 'Suphan Buri',
        'สุราษฎร์ธานี': 'Surat Thani', 'สุรินทร์': 'Surin', 'หนองคาย': 'Nong Khai', 'หนองบัวลำภู': 'Nong Bua Lamphu',
        'อ่างทอง': 'Ang Thong', 'อำนาจเจริญ': 'Amnat Charoen', 'อุดรธานี': 'Udon Thani', 'อุตรดิตถ์': 'Uttaradit',
        'อุทัยธานี': 'Uthai Thani', 'อุบลราชธานี': 'Ubon Ratchathani'
      };

      const normalizeLabel = (label) => String(label || '').replace(/\u00a0/g, ' ').replace(/\s+/g, ' ').trim();
      const translatePartyName = (name, lang) => {
        if (!name) return name;
        if (lang === 'en') return PARTY_MAP[name] || name;
        return PARTY_NAME_TH[name] || name;
      };
      const translateDistrictLabel = (label, lang) => {
        if (!label || lang !== 'en') return label;
        const cleaned = normalizeLabel(label);
        const match = cleaned.match(/^(.*?)(?:\s*(?:[-—])\s*)?(?:เขต\s*)?(\d+)\s*$/);
        if (!match) return label;
        let province = match[1].replace(/\s*เขต\s*/g,'').trim();
        const dist = match[2];
        const translated = PROVINCE_MAP[province];
        if (!translated) return label;
        return `${translated} District ${dist}`;
      };

      const buildHoverTemplate = (lang, includeParty) => {
        const h = HOVER_LABEL[lang] || HOVER_LABEL.th;
        const partyLine = includeParty ? `${h.party}: %{customdata[2]}<br>` : '';
        return `<b>%{text}</b><br>${h.candidate}: %{customdata[1]}<br>${partyLine}${h.constPct}: %{x:.1f}%<br>${h.listPct}: %{y:.1f}%<extra></extra>`;
      };

      const shareData = JSON.parse(document.getElementById('share-data').textContent || '{}');
      const candData = JSON.parse(document.getElementById('candidate-data').textContent || '{}');
      const constCand = candData.const || {};

      const winnerByDistrict = {};
      Object.keys(constCand).forEach((distKey) => {
        const parties = constCand[distKey] || {};
        let bestParty = null;
        let bestShare = -1;
        Object.keys(parties).forEach((party) => {
          const share = Number((parties[party] || {}).share || 0);
          if (share > bestShare) {
            bestShare = share;
            bestParty = party;
          }
        });
        if (bestParty) winnerByDistrict[distKey] = bestParty;
      });

      const toLabel = (key) => {
        if (!key) return '';
        const parts = String(key).split('_');
        if (parts.length >= 2) {
          const province = parts.slice(0, -1).join(' ');
          const dist = parts[parts.length - 1];
          return `${province} ${dist}`;
        }
        return key;
      };

      const buildPoints = (party, lang) => {
        const result = { win: { x: [], y: [], custom: [] }, lose: { x: [], y: [], custom: [] } };
        const pdata = shareData[party] || {};
        const constShare = pdata.const || {};
        const listShare = pdata.list || {};
        const keys = new Set([...Object.keys(constShare), ...Object.keys(listShare)]);
        keys.forEach((key) => {
          const x = Number(constShare[key] || 0);
          const y = Number(listShare[key] || 0);
          const candidate = (constCand[key] && constCand[key][party] && constCand[key][party].candidate) || '';
          const label = toLabel(key);
          const custom = [translateDistrictLabel(label, lang), candidate, translatePartyName(party, lang)];
          const isWinner = winnerByDistrict[key] === party;
          if (isWinner) {
            result.win.x.push(x);
            result.win.y.push(y);
            result.win.custom.push(custom);
          } else {
            result.lose.x.push(x);
            result.lose.y.push(y);
            result.lose.custom.push(custom);
          }
        });
        return result;
      };

      const buildAllPoints = (lang) => {
        const result = { win: { x: [], y: [], custom: [] }, lose: { x: [], y: [], custom: [] } };
        Object.keys(shareData).forEach((party) => {
          const pts = buildPoints(party, lang);
          result.win.x.push(...pts.win.x);
          result.win.y.push(...pts.win.y);
          result.win.custom.push(...pts.win.custom);
          result.lose.x.push(...pts.lose.x);
          result.lose.y.push(...pts.lose.y);
          result.lose.custom.push(...pts.lose.custom);
        });
        return result;
      };

      const regressionLine = (x, y, minPoints = 30) => {
        if (!x.length || !y.length) return null;
        const n = x.length;
        if (n < minPoints) return null;
        const mean = (arr) => arr.reduce((a,b) => a+b, 0) / n;
        const mx = mean(x), my = mean(y);
        let num = 0, den = 0;
        for (let i=0;i<n;i++) {
          num += (x[i]-mx)*(y[i]-my);
          den += (x[i]-mx)*(x[i]-mx);
        }
        if (!den) return null;
        const slope = num/den;
        const intercept = my - slope*mx;
        let ssTot = 0, ssRes = 0;
        for (let i=0;i<n;i++) {
          const yi = y[i];
          const yhat = slope * x[i] + intercept;
          ssTot += (yi - my) * (yi - my);
          ssRes += (yi - yhat) * (yi - yhat);
        }
        const r2 = ssTot ? (1 - ssRes / ssTot) : null;
        const minX = Math.min(...x), maxX = Math.max(...x);
        return { x: [minX, maxX], y: [slope*minX+intercept, slope*maxX+intercept], slope, r2 };
      };

      const buildTraces = (party, lang) => {
        const data = (party === 'ทั้งหมด') ? buildAllPoints(lang) : buildPoints(party, lang);
        const win = {
          type: 'scatter', mode: 'markers',
          name: lang === 'en' ? NAME_MAP.en.winner : NAME_MAP.th.winner,
          x: data.win.x, y: data.win.y,
          marker: { color: '#1f4bff', size: 6 },
          customdata: data.win.custom,
          text: data.win.custom.map((row) => row[0]),
          hovertemplate: buildHoverTemplate(lang, true)
        };
        const lose = {
          type: 'scatter', mode: 'markers',
          name: lang === 'en' ? NAME_MAP.en.loser : NAME_MAP.th.loser,
          x: data.lose.x, y: data.lose.y,
          marker: { color: '#e03131', size: 6, symbol: 'x' },
          customdata: data.lose.custom,
          text: data.lose.custom.map((row) => row[0]),
          hovertemplate: buildHoverTemplate(lang, true)
        };
        const traces = [win, lose];
        const allX = data.win.x.concat(data.lose.x);
        const allY = data.win.y.concat(data.lose.y);
        const reg = regressionLine(allX, allY);
        if (reg) {
          traces.push({
            type: 'scatter', mode: 'lines',
            name: lang === 'en'
              ? `${NAME_MAP.en.regression} (slope=${reg.slope.toFixed(2)}, R²=${reg.r2 !== null ? reg.r2.toFixed(2) : '—'})`
              : `${NAME_MAP.th.regression} (slope=${reg.slope.toFixed(2)}, R²=${reg.r2 !== null ? reg.r2.toFixed(2) : '—'})`,
            x: reg.x, y: reg.y,
            line: { color: '#111', width: 2 },
            hoverinfo: 'skip'
          });
        }
        const min = 0, max = 100;
        traces.push({
          type: 'scatter', mode: 'lines',
          name: lang === 'en' ? NAME_MAP.en.yEquals : NAME_MAP.th.yEquals,
          x: [min, max], y: [min, max],
          line: { color: '#777', width: 1, dash: 'dash' },
          hoverinfo: 'skip'
        });
        return traces;
      };

      const updateLayout = (party, lang, traces) => {
        const t = TITLE_TEXT[lang] || TITLE_TEXT.th;
        const title = (party === 'ทั้งหมด') ? t.all : t.party(translatePartyName(party, lang));
        const axis = AXIS_TEXT[lang] || AXIS_TEXT.th;
        let xMax = 60;
        let yMax = 60;
        if (party !== 'ทั้งหมด' && Array.isArray(traces)) {
          const xs = [];
          const ys = [];
          traces.forEach((tr) => {
            if (tr && tr.mode === 'markers' && Array.isArray(tr.x) && Array.isArray(tr.y)) {
              xs.push(...tr.x);
              ys.push(...tr.y);
            }
          });
          if (xs.length) {
            const maxVal = Math.max(...xs, ...ys);
            const padded = Math.min(100, Math.max(5, Math.ceil(maxVal * 1.1)));
            xMax = padded;
            yMax = padded;
          }
        }
        const isMobile = (window.innerWidth || document.documentElement.clientWidth) <= 720;
        const plotEl = document.getElementById('plot');
        const width = plotEl ? plotEl.getBoundingClientRect().width : 520;
        const legendSpace = isMobile ? 80 : 90;
        const layout = {
          title: { text: title, x: 0.02 },
          xaxis: { title: { text: axis.x }, range: [0, xMax] },
          yaxis: { title: { text: axis.y }, range: [0, yMax] },
          margin: { l: 60, r: 30, t: 50, b: isMobile ? 60 : 90 },
          legend: { orientation: 'h', y: isMobile ? -0.18 : -0.28 },
          font: { family: 'Sarabun, sans-serif', size: 12 },
          height: Math.round(width + legendSpace),
          autosize: true
        };
        return layout;
      };

      const render = () => {
        const party = currentParty || 'ทั้งหมด';
        const traces = buildTraces(party, currentLang);
        const layout = updateLayout(party, currentLang, traces);
        Plotly.react('plot', traces, layout, { displayModeBar: false, responsive: true }).then(() => {
          try {
            const plotEl = document.getElementById('plot');
            const height = plotEl ? plotEl.getBoundingClientRect().height : layout.height || 520;
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'scatter-height', height: Math.ceil(height) }, '*');
            }
          } catch (err) {}
        });
      };

      window.addEventListener('message', (event) => {
        if (!event || !event.data) return;
        if (event.data.type === 'set-lang') {
          currentLang = (event.data.lang === 'en' ? 'en' : 'th');
          try { localStorage.setItem('lang', currentLang); } catch (err) {}
          render();
        }
        if (event.data.type === 'party-select') {
          if (event.data.lang) {
            currentLang = (event.data.lang === 'en' ? 'en' : 'th');
            try { localStorage.setItem('lang', currentLang); } catch (err) {}
          }
          currentParty = event.data.party || 'ทั้งหมด';
          render();
        }
      });

      render();
    })();
  </script>
</body>
