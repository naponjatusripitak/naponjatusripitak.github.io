      const n = DATA.length;
      const avgC = (DATA.reduce((s,d)=>s+d.constPct,0)/n).toFixed(2);
      const avgL = (DATA.reduce((s,d)=>s+d.listPct,0)/n).toFixed(2);
      const avgD = (DATA.reduce((s,d)=>s+d.gap,0)/n).toFixed(2);
      const p = ((DATA.filter(d=>d.gap>0).length/n)*100).toFixed(1);
      document.getElementById('meta').textContent = t.meta(n, avgC, avgL, avgD, p);

      Plotly.react('chart', traces, layout, { displayModeBar:false, responsive:true });
    }

    window.addEventListener('message', (event) => {
      if (event && event.data && event.data.type === 'set-lang') {
        lang = event.data.lang || 'th';
        try { localStorage.setItem('lang', lang); } catch (e) {}
        build(lang);
      }
      if (event && event.data && event.data.type === 'region-resize') {
        Plotly.Plots.resize('chart');
      }
    });

    build(lang);
  </script>
</body>
</html>
