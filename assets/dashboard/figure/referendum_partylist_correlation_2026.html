<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Referendum vs Party-list Correlation</title>
  <style>
    html, body { margin: 0; padding: 0; background: #f6f7f9; }
    body { font-family: Kanit, system-ui, sans-serif; color: #0f172a; }
    .wrap { padding: 12px; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    label { font-size: 12px; font-weight: 700; color: #334155; }
    select {
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      padding: 6px 10px;
      background: #fff;
      font-family: inherit;
      font-size: 13px;
      min-width: 180px;
    }
    .stat {
      margin-left: auto;
      font-size: 12px;
      color: #475569;
      font-variant-numeric: tabular-nums;
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 999px;
      padding: 6px 10px;
    }
    .card {
      background: #fff;
      border: 1px solid #e2e8f0;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 8px 18px rgba(15,23,42,0.08);
      margin-bottom: 10px;
    }
    #scatter { height: 520px; }
    #rank { height: 420px; }
    .note { font-size: 12px; color: #64748b; margin-top: 6px; }
    .panel-title {
      font-size: 13px;
      font-weight: 700;
      color: #1f2937;
      margin: 2px 2px 8px;
    }
    @media (max-width: 900px) {
      .wrap { padding: 8px; }
      .controls {
        flex-direction: column;
        align-items: stretch;
        gap: 6px;
      }
      select {
        width: 100%;
        min-width: 0;
      }
      .stat {
        margin-left: 0;
        align-self: flex-start;
      }
      #scatter { height: 460px; }
      #rank { height: 620px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="controls" id="controls">
      <label for="party-select" id="label-party">พรรค (บัญชีรายชื่อ)</label>
      <select id="party-select"></select>

      <label for="metric-select" id="label-metric">ตัวชี้วัดประชามติ</label>
      <select id="metric-select">
        <option value="percent_yes">เห็นชอบ (%)</option>
        <option value="percent_no">ไม่เห็นชอบ (%)</option>
        <option value="percent_abstained">ไม่แสดงความคิดเห็น (%)</option>
      </select>

      <div class="stat" id="stat-line">r = -, R² = -, n = -</div>
    </div>

    <div class="card" id="scatter-card">
      <div class="panel-title" id="scatter-panel-title">Scatter</div>
      <div id="scatter"></div>
    </div>

    <div class="card" id="rank-card">
      <div class="panel-title" id="rank-panel-title">Pearson r ranking</div>
      <div id="rank"></div>
      <div class="note" id="rank-note">ค่า Pearson r แสดงความสัมพันธ์ระหว่างสัดส่วนคะแนนบัญชีรายชื่อของแต่ละพรรคกับสัดส่วนผู้ลงคะแนนในตัวเลือกประชามติที่กำหนด (ค่าบวก = สัมพันธ์ทางเดียวกัน, ค่าลบ = สวนทางกัน)</div>
    </div>
  </div>

  <script src="plotly.min.js"></script>
  <script src="../data/election_results_2569_by_dist.js"></script>
  <script src="../data/referendum_results_2569_by_dist.js"></script>
  <script>
    const I18N = {
      th: {
        labelParty: 'พรรค (บัญชีรายชื่อ)',
        labelMetric: 'ตัวชี้วัดประชามติ',
        metricYes: 'เห็นชอบ (%)',
        metricNo: 'ไม่เห็นชอบ (%)',
        metricAbs: 'ไม่แสดงความคิดเห็น (%)',
        scatterPanelTitle: 'Scatter: คะแนนบัญชีรายชื่อ vs ผลประชามติ',
        rankPanelTitle: 'Pearson r ranking',
        xTitle: 'สัดส่วนคะแนนบัญชีรายชื่อพรรค (%)',
        lineName: 'เส้นแนวโน้มที่เหมาะสมที่สุด',
        pointName: 'เขตเลือกตั้ง',
        rankX: 'Pearson r',
        stat: 'r = {r}, R² = {r2}, n = {n}',
        rankNote: 'ค่า Pearson r แสดงความสัมพันธ์ระหว่างสัดส่วนคะแนนบัญชีรายชื่อของแต่ละพรรคกับสัดส่วนผู้ลงคะแนนในตัวเลือกประชามติที่กำหนด (ค่าบวก = สัมพันธ์ทางเดียวกัน, ค่าลบ = สวนทางกัน)'
      },
      en: {
        labelParty: 'Party (party-list)',
        labelMetric: 'Referendum metric',
        metricYes: 'Yes (%)',
        metricNo: 'No (%)',
        metricAbs: 'No preference (%)',
        scatterPanelTitle: 'Scatter: Party-list support vs referendum',
        rankPanelTitle: 'Pearson r ranking',
        xTitle: 'Party-list vote share (%)',
        lineName: 'Line of best fit',
        pointName: 'Constituencies',
        rankX: 'Pearson r',
        stat: 'r = {r}, R² = {r2}, n = {n}',
        rankNote: 'Pearson r shows the relationship between each party’s party-list vote share and the share voting for the selected referendum option (positive = move in the same direction, negative = move in opposite directions).'
      }
    };

    const PARTY_COLORS = (window.__electionResults2569 && window.__electionResults2569.colorMapping) || {};
    const byDist = (window.__electionResults2569 && window.__electionResults2569.byDist) || {};
    const referendum = (window.__referendumResults2569ByDist && window.__referendumResults2569ByDist.byDist) || {};
    const VIEW = (new URLSearchParams(location.search).get('view') || 'both').toLowerCase();

    let lang = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || localStorage.getItem('dashboardLang') || 'th');
    if (!['th', 'en'].includes(lang)) lang = 'th';

    let partyMap = {};
    const t = (k) => (I18N[lang] && I18N[lang][k]) ? I18N[lang][k] : k;
    const fmt = (x, d=3) => Number.isFinite(x) ? x.toFixed(d) : '-';
    const partyLabel = (p) => (lang === 'en' ? (partyMap[p] || p) : p);

    function setText() {
      document.getElementById('label-party').textContent = t('labelParty');
      document.getElementById('label-metric').textContent = t('labelMetric');
      document.getElementById('scatter-panel-title').textContent = t('scatterPanelTitle');
      document.getElementById('rank-panel-title').textContent = t('rankPanelTitle');
      const ms = document.getElementById('metric-select');
      ms.querySelector('option[value="percent_yes"]').textContent = t('metricYes');
      ms.querySelector('option[value="percent_no"]').textContent = t('metricNo');
      ms.querySelector('option[value="percent_abstained"]').textContent = t('metricAbs');
      document.getElementById('rank-note').textContent = t('rankNote');
    }

    function pearson(x, y) {
      const n = x.length;
      if (n < 2) return NaN;
      let sx = 0, sy = 0;
      for (let i = 0; i < n; i++) { sx += x[i]; sy += y[i]; }
      const mx = sx / n, my = sy / n;
      let num = 0, dx = 0, dy = 0;
      for (let i = 0; i < n; i++) {
        const a = x[i] - mx;
        const b = y[i] - my;
        num += a * b;
        dx += a * a;
        dy += b * b;
      }
      const den = Math.sqrt(dx * dy);
      return den > 0 ? num / den : NaN;
    }

    function linearFit(x, y) {
      const n = x.length;
      if (n < 2) return null;
      let sx = 0, sy = 0, sxy = 0, sxx = 0;
      for (let i = 0; i < n; i++) {
        sx += x[i];
        sy += y[i];
        sxy += x[i] * y[i];
        sxx += x[i] * x[i];
      }
      const denom = (n * sxx - sx * sx);
      if (Math.abs(denom) < 1e-12) return null;
      const slope = (n * sxy - sx * sy) / denom;
      const intercept = (sy - slope * sx) / n;
      return { slope, intercept };
    }

    function collectPartyShares() {
      const partyDistShare = {};
      const partyTotalVotes = {};
      const constSeatWins = {};

      const estimatePartyListSeats = (votesByParty, totalListSeats) => {
        const out = new Map();
        const partyNames = Object.keys(votesByParty || {});
        if (!partyNames.length || !totalListSeats) return out;
        const V = partyNames.reduce((acc, p) => acc + (Number(votesByParty[p] || 0) || 0), 0);
        if (!V) return out;
        const Q = V / totalListSeats;
        const alloc = partyNames.map((party) => {
          const votes = Number(votesByParty[party] || 0) || 0;
          const raw = votes / Q;
          return { party, base: Math.floor(raw), rem: raw - Math.floor(raw) };
        });
        let used = alloc.reduce((acc, r) => acc + r.base, 0);
        let remaining = totalListSeats - used;
        alloc.sort((a, b) => (b.rem - a.rem) || a.party.localeCompare(b.party, 'th'));
        for (let i = 0; i < alloc.length && remaining > 0; i++) {
          alloc[i].base += 1;
          remaining -= 1;
        }
        alloc.forEach((r) => out.set(r.party, r.base));
        return out;
      };

      Object.entries(byDist).forEach(([distId, dist]) => {
        const winner = dist && dist.winner_const_party ? String(dist.winner_const_party).trim() : '';
        if (winner) constSeatWins[winner] = (constSeatWins[winner] || 0) + 1;
        const plist = Array.isArray(dist.plist_parties) ? dist.plist_parties : [];
        plist.forEach((row) => {
          if (!row || !row.party) return;
          const party = row.party;
          const share = Number(row.plist_pp || 0);
          const votes = Number(
            row.votes != null ? row.votes : (row.plist != null ? row.plist : 0)
          ) || 0;
          if (!partyDistShare[party]) partyDistShare[party] = {};
          partyDistShare[party][distId] = share;
          partyTotalVotes[party] = (partyTotalVotes[party] || 0) + votes;
        });
      });

      const listSeatMap = estimatePartyListSeats(partyTotalVotes, 100);
      const seatWinningParties = new Set();
      const allParties = new Set([...Object.keys(constSeatWins), ...Object.keys(partyTotalVotes)]);
      allParties.forEach((party) => {
        const totalSeats = (Number(constSeatWins[party] || 0) || 0) + (Number(listSeatMap.get(party) || 0) || 0);
        if (totalSeats > 0) seatWinningParties.add(party);
      });

      const parties = Object.keys(partyDistShare)
        .filter((p) => seatWinningParties.has(p))
        .sort((a, b) => (partyTotalVotes[b] || 0) - (partyTotalVotes[a] || 0));
      return { partyDistShare, parties };
    }

    const { partyDistShare, parties } = collectPartyShares();
    const partySelect = document.getElementById('party-select');
    const metricSelect = document.getElementById('metric-select');
    const statLine = document.getElementById('stat-line');
    const frameId = VIEW === 'ranking'
      ? 'referendum-correlation-rank-frame'
      : 'referendum-correlation-scatter-frame';
    const controlsEl = document.getElementById('controls');
    const scatterCardEl = document.getElementById('scatter-card');
    const rankCardEl = document.getElementById('rank-card');
    const partyLabelEl = document.getElementById('label-party');
    let lastIsMobile = window.innerWidth <= 900;

    function postHeight() {
      const h = Math.max(
        document.body ? document.body.scrollHeight : 0,
        document.documentElement ? document.documentElement.scrollHeight : 0
      );
      if (window.parent) {
        window.parent.postMessage({ type: 'iframe-height', id: frameId, height: h }, '*');
      }
    }

    function populateParties() {
      partySelect.innerHTML = '';
      parties.forEach((p) => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = partyLabel(p);
        partySelect.appendChild(opt);
      });
      if (parties.includes('ภูมิใจไทย')) partySelect.value = 'ภูมิใจไทย';
    }

    function pairedSeriesFor(party, metric) {
      const x = [];
      const y = [];
      const label = [];
      const shares = partyDistShare[party] || {};

      Object.keys(shares).forEach((distId) => {
        const r = referendum[distId];
        if (!r) return;
        const xv = Number(shares[distId]);
        const yv = Number(r[metric]);
        if (!Number.isFinite(xv) || !Number.isFinite(yv)) return;
        x.push(xv);
        y.push(yv);
        label.push(distId);
      });

      return { x, y, label };
    }

    function computeRanking(metric) {
      const rows = [];
      parties.forEach((p) => {
        const s = pairedSeriesFor(p, metric);
        if (s.x.length < 2) return;
        const r = pearson(s.x, s.y);
        if (!Number.isFinite(r)) return;
        rows.push({ party: p, r, n: s.x.length });
      });
      rows.sort((a, b) => a.r - b.r);
      return rows;
    }

    function render() {
      const party = partySelect.value || parties[0];
      const metric = metricSelect.value;
      const metricLabel = metricSelect.options[metricSelect.selectedIndex].textContent;
      const isMobile = window.innerWidth <= 900;

      const s = pairedSeriesFor(party, metric);
      const r = pearson(s.x, s.y);
      const fit = linearFit(s.x, s.y);
      const r2 = Number.isFinite(r) ? r * r : NaN;

      statLine.textContent = t('stat')
        .replace('{r}', fmt(r, 3))
        .replace('{r2}', fmt(r2, 3))
        .replace('{n}', String(s.x.length));

      const partyColor = PARTY_COLORS[party] || '#2563eb';
      const traces = [
        {
          type: 'scattergl',
          mode: 'markers',
          x: s.x,
          y: s.y,
          text: s.label,
          name: t('pointName'),
          marker: {
            color: partyColor,
            opacity: 0.65,
            size: 8,
            line: { width: 0 }
          },
          hovertemplate: '%{text}<br>x=%{x:.2f}%<br>y=%{y:.2f}%<extra></extra>'
        }
      ];

      if (fit && s.x.length > 1) {
        const xmin = Math.min(...s.x);
        const xmax = Math.max(...s.x);
        const xs = [xmin, xmax];
        const ys = xs.map((xx) => fit.slope * xx + fit.intercept);
        traces.push({
          type: 'scatter',
          mode: 'lines',
          x: xs,
          y: ys,
          name: t('lineName'),
          line: { color: '#111827', width: 2 }
        });
      }

      if (VIEW !== 'ranking') {
        Plotly.newPlot('scatter', traces, {
          margin: isMobile ? { l: 50, r: 12, t: 16, b: 52 } : { l: 60, r: 20, t: 20, b: 56 },
          xaxis: { title: t('xTitle'), zeroline: false },
          yaxis: { title: metricLabel, zeroline: false },
          paper_bgcolor: '#ffffff',
          plot_bgcolor: '#ffffff',
          legend: { orientation: 'h', x: 0, y: 1.12 },
        }, { displayModeBar: false, responsive: true }).then(() => {
          postHeight();
        });
      }

      const rankRows = computeRanking(metric);
      const shown = rankRows.slice().sort((a, b) => b.r - a.r);
      if (VIEW === 'scatter') return;
      const yNames = shown.map((d) => partyLabel(d.party));
      const positives = shown.filter((d) => d.r >= 0);
      const negatives = shown.filter((d) => d.r < 0);
      Plotly.newPlot('rank', [
        {
          type: 'bar',
          orientation: 'h',
          y: yNames,
          x: shown.map((d) => d.r),
          showlegend: false,
          marker: {
            color: shown.map((d) => d.r >= 0 ? '#0f8a5f' : '#c0392b'),
            line: { color: '#ffffff', width: 0.5 }
          },
          customdata: shown.map((d) => d.n),
          hovertemplate: '%{y}<br>r=%{x:.3f}<br>n=%{customdata}<extra></extra>'
        },
        {
          type: 'scatter',
          mode: 'text',
          x: positives.map(() => -0.03),
          y: positives.map((d) => partyLabel(d.party)),
          text: positives.map((d) => partyLabel(d.party)),
          textposition: 'middle left',
          textfont: { size: isMobile ? 10 : 11, color: '#334155' },
          hoverinfo: 'skip',
          showlegend: false,
          cliponaxis: false
        },
        {
          type: 'scatter',
          mode: 'text',
          x: negatives.map(() => 0.03),
          y: negatives.map((d) => partyLabel(d.party)),
          text: negatives.map((d) => partyLabel(d.party)),
          textposition: 'middle right',
          textfont: { size: isMobile ? 10 : 11, color: '#334155' },
          hoverinfo: 'skip',
          showlegend: false,
          cliponaxis: false
        }
      ], {
        showlegend: false,
        margin: isMobile ? { l: 26, r: 26, t: 16, b: 46 } : { l: 34, r: 34, t: 20, b: 50 },
        xaxis: { title: t('rankX'), range: [-1, 1], zeroline: true, zerolinecolor: '#94a3b8' },
        yaxis: { autorange: 'reversed', showticklabels: false, showgrid: false },
        paper_bgcolor: '#ffffff',
        plot_bgcolor: '#ffffff'
      }, { displayModeBar: false, responsive: true }).then(() => {
        postHeight();
      });
    }

    partySelect.addEventListener('change', render);
    metricSelect.addEventListener('change', render);
    let resizeTimer = null;
    window.addEventListener('resize', () => {
      if (resizeTimer) clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => {
        const nowIsMobile = window.innerWidth <= 900;
        // Rebuild charts when crossing breakpoint because desktop/mobile use different containers.
        if (nowIsMobile !== lastIsMobile) {
          lastIsMobile = nowIsMobile;
          render();
          return;
        }
        const scatterEl = document.getElementById('scatter');
        const rankEl = document.getElementById('rank');
        try { if (scatterEl) Plotly.Plots.resize(scatterEl); } catch (e) {}
        try { if (rankEl && rankEl.data) Plotly.Plots.resize(rankEl); } catch (e) {}
        postHeight();
      }, 120);
    });

    window.addEventListener('message', (event) => {
      const data = (event && event.data) ? event.data : {};
      if (data.type === 'set-lang') {
        if (data.partyMap && typeof data.partyMap === 'object') partyMap = data.partyMap;
        lang = (data.lang === 'en') ? 'en' : 'th';
        setText();
        populateParties();
        render();
      }
    });

    setText();
    populateParties();

    if (VIEW === 'scatter') {
      if (rankCardEl) rankCardEl.style.display = 'none';
    } else if (VIEW === 'ranking') {
      if (scatterCardEl) scatterCardEl.style.display = 'none';
      if (partySelect) partySelect.style.display = 'none';
      if (partyLabelEl) partyLabelEl.style.display = 'none';
      if (statLine) statLine.style.display = 'none';
    }

    render();
    setTimeout(postHeight, 50);
    setTimeout(postHeight, 300);
  </script>
</body>
</html>
