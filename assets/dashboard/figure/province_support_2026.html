    let currentParty = parties[0] || '';
    let mode = 'const';

    function computeAll() {
      const provMap = dataMap[currentParty] || {};
      const entries = Object.keys(provMap).map((prov) => {
        const v = provMap[prov] || {};
        const val = mode === 'const' ? (v.vote_share_const || 0) : (v.vote_share_list || 0);
        return { prov, val };
      }).sort((a,b) => b.val - a.val);
      return entries;
    }

    function render() {
      const entries = computeAll();
      const y = entries.map((e) => displayProvinceName(e.prov)).reverse();
      const x = entries.map((e) => e.val).reverse();
      const trace = {
        type: 'bar',
        orientation: 'h',
        x,
        y,
        width: 0.6,
        marker: { color: colorMap[currentParty] || '#9CA3AF' },
        hovertemplate: '%{y}<br>%{x:.2f}%<extra></extra>'
      };
      const dynamicHeight = Math.max(920, entries.length * 32 + 200);
      const layout = {
        margin: { l: 140, r: 20, t: 36, b: 90 },
        xaxis: { title: t('xAxis'), rangemode: 'tozero' },
        yaxis: { automargin: true },
        height: dynamicHeight,
        bargap: 0.02,
        title: { text: (LANG_TEXT[currentLang]||LANG_TEXT.th).title(displayPartyName(currentParty), mode), x: 0.01, font: { size: 14 } },
        font: { family: 'Sarabun, sans-serif', size: 12 }
      };
      Plotly.react('chart', [trace], layout, { displayModeBar: false, responsive: true });
      const chartEl = document.getElementById('chart');
      if (chartEl) chartEl.style.height = `${dynamicHeight}px`;
      setTimeout(() => {
        const h = document.getElementById('wrap').scrollHeight;
        if (window.parent) window.parent.postMessage({ type:'iframe-height', id:'province-support-frame', height:h }, '*');
      }, 50);
    }

    const btnConst = document.getElementById('mode-const');
    const btnList = document.getElementById('mode-list');
    function refreshButtons() {
      btnConst.textContent = t('constBtn');
      btnList.textContent = t('listBtn');
      btnConst.classList.toggle('active', mode === 'const');
      btnList.classList.toggle('active', mode === 'list');
    }

    btnConst.addEventListener('click', () => { mode = 'const'; refreshButtons(); render(); });
    btnList.addEventListener('click', () => { mode = 'list'; refreshButtons(); render(); });

    window.addEventListener('message', (event) => {
      const data = (event && event.data) || {};
      if ((data.type === 'party-select' || data.type === 'set-party') && data.party) {
        if (dataMap[data.party]) {
          currentParty = data.party;
          render();
        }
      }
      if (data.type === 'set-lang') {
        currentLang = (data.lang === 'en') ? 'en' : 'th';
        try { localStorage.setItem('lang', currentLang); } catch (err) {}
        refreshButtons();
        render();
      }
      if (data.type === 'request-province-parties') {
        window.parent.postMessage({ type:'province-parties', parties }, '*');
      }
    });

    refreshButtons();
    render();
  </script>
