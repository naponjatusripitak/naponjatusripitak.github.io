<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="plotly.min.js"></script>
  <script src="../data/election_results_2566_by_dist.js"></script>
  <style>
    @font-face {
      font-family: 'Sarabun';
      src: url('../font/Sarabun/Sarabun-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    html,body,#chart { margin:0; padding:0; width:100%; height:100%; background:#fff; }
    #popup {
      position: fixed;
      inset: 12px;
      display: none;
      z-index: 9999;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(15,23,42,0.18);
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(15,23,42,0.22);
      font-family: Sarabun, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #0f172a;
      overflow: hidden;
    }
    #popup.show { display: grid; grid-template-rows: auto 1fr; }
    #popupHeader {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 12px 10px;
      border-bottom: 1px solid rgba(15,23,42,0.10);
      background: #fff;
    }
    #popupTitle { font-weight: 900; font-size: 13px; line-height: 1.2; }
    #popupSub { font-size: 12px; color: #475569; margin-top: 2px; }
    #popupClose {
      margin-left: auto;
      border: 1px solid rgba(15,23,42,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      color: #0f172a;
    }
    #popupBody { overflow: auto; background: #fff; }
    #popupBody .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      cursor: pointer;
    }
    #popupBody .row:hover { background: rgba(15,23,42,0.03); }
    #popupBody .mono { font-variant-numeric: tabular-nums; white-space: nowrap; color: #334155; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div id="popup" role="dialog" aria-modal="true" aria-label="Heatmap details">
    <div id="popupHeader">
      <div>
        <div id="popupTitle"></div>
        <div id="popupSub"></div>
      </div>
      <button id="popupClose" type="button">Close</button>
    </div>
    <div id="popupBody"></div>
  </div>
  <script>
    const data = [{"type": "heatmap", "z": [[110, 2, 0, 0], [23, 89, 0, 0], [34, 29, 4, 1], [23, 11, 2, 3], [13, 1, 8, 1], [11, 2, 8, 1], [8, 1, 0, 0], [0, 0, 0, 7], [0, 5, 0, 0], [0, 2, 0, 0], [1, 0, 0, 0]], "x": ["ก้าวไกล", "เพื่อไทย", "รวมไทยสร้างชาติ", "ประชาชาติ"], "y": ["ก้าวไกล", "เพื่อไทย", "ภูมิใจไทย", "พลังประชารัฐ", "รวมไทยสร้างชาติ", "ประชาธิปัตย์", "ชาติไทยพัฒนา", "ประชาชาติ", "ไทยสร้างไทย", "เพื่อไทรวมพลัง", "ชาติพัฒนากล้า"], "colorscale": [[0.0, "#fff5f0"], [0.125, "#fee0d2"], [0.25, "#fcbba1"], [0.375, "#fc9272"], [0.5, "#fb6a4a"], [0.625, "#ef3b2c"], [0.75, "#cb181d"], [1.0, "#99000d"]], "zmin": 0, "showscale": true, "colorbar": {"title": {"text": "จำนวนเขต", "side": "right"}}, "text": [["110", "2", "0", "0"], ["23", "89", "0", "0"], ["34", "29", "4", "1"], ["23", "11", "2", "3"], ["13", "1", "8", "1"], ["11", "2", "8", "1"], ["8", "1", "0", "0"], ["0", "0", "0", "7"], ["0", "5", "0", "0"], ["0", "2", "0", "0"], ["1", "0", "0", "0"]], "texttemplate": "%{text}", "textfont": {"color": [["white", "black", "black", "black"], ["black", "white", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"], ["black", "black", "black", "black"]], "size": 12}, "hovertemplate": "พรรคที่ชนะเขต: %{y}<br>พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด: %{x}<br>จำนวนเขต: %{z}<extra></extra>", "xgap": 1, "ygap": 1}];
    const layout = {"margin": {"l": 140, "r": 30, "t": 40, "b": 140}, "xaxis": {"title": "พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด", "tickangle": 45, "tickfont": {"size": 12}}, "yaxis": {"title": "พรรคที่ชนะเขต", "tickangle": 0, "tickfont": {"size": 12}, "autorange": "reversed"}, "height": 720, "paper_bgcolor": "#ffffff", "plot_bgcolor": "#ffffff", "font": {"family": "Sarabun, Arial, sans-serif", "size": 12}};
    const config = {displayModeBar:false, responsive:true};
    const LANG_TEXT = {
      th: {
        x: 'พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด',
        y: 'พรรคที่ชนะเขต',
        cb: 'จำนวนเขต',
        hover: 'พรรคที่ชนะเขต: %{y}<br>พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด: %{x}<br>จำนวนเขต: %{z}<extra></extra>'
      },
      en: {
        x: 'Top party-list winner',
        y: 'Constituency winner',
        cb: 'Constituencies',
        hover: 'Constituency winner: %{y}<br>Top party-list winner: %{x}<br>Constituencies: %{z}<extra></extra>'
      }
    };
    const PARTY_NAME_EN = {
      'ก้าวไกล': 'Move Forward',
      'เพื่อไทย': 'Pheu Thai',
      'ภูมิใจไทย': 'Bhumjaithai',
      'พลังประชารัฐ': 'Palang Pracharath',
      'รวมไทยสร้างชาติ': 'United Thai Nation',
      'ประชาธิปัตย์': 'Democrat',
      'ชาติไทยพัฒนา': 'Chart Thai Pattana',
      'ประชาชาติ': 'Prachachat',
      'ไทยสร้างไทย': 'Thai Sang Thai',
      'เพื่อไทรวมพลัง': 'Pheu Thai Ruam Palang',
      'ชาติพัฒนากล้า': 'Chart Pattana Kla'
    };
    const baseX = data[0].x.slice();
    const baseY = data[0].y.slice();
    const initLang = () => {
      const urlLang = new URLSearchParams(window.location.search).get('lang');
      const stored = localStorage.getItem('lang');
      return urlLang || stored || 'th';
    };
    let currentLang = initLang();
    const translateParty = (name, lang) => (lang === 'en' ? (PARTY_NAME_EN[name] || name) : name);
    const applyLang = (lang) => {
      currentLang = lang;
      const t = LANG_TEXT[lang] || LANG_TEXT.th;
      data[0].x = baseX.map((p) => translateParty(p, lang));
      data[0].y = baseY.map((p) => translateParty(p, lang));
      layout.xaxis.title = t.x;
      layout.yaxis.title = t.y;
      if (data[0] && data[0].colorbar) data[0].colorbar.title.text = t.cb;
      data[0].hovertemplate = t.hover;
      Plotly.react('chart', data, layout, config);
    };

    Plotly.newPlot('chart', data, layout, config);
    applyLang(currentLang);
    window.addEventListener('resize', () => Plotly.Plots.resize('chart'));

    // Click popup: list constituencies in the selected cell (computed from 2566 by-district results).
    let distIndexByPair = {}; // "c|||p" -> [{distId,label,cand,mov_pp,mov_votes}]
    (() => {
      const byDist = (window.__results2566ByDist && typeof window.__results2566ByDist === 'object') ? window.__results2566ByDist : {};
      const idx = {};
      Object.keys(byDist).forEach((distId) => {
        const row = byDist[distId] || {};
        const cParty = row.winner_const_party || '';
        const pParty = row.winner_plist_party || '';
        if (!cParty || !pParty) return;
        const cands = Array.isArray(row.const_candidates) ? row.const_candidates : [];
        const w = cands[0] || null;
        const r = cands[1] || null;
        const wVotes = Number(w && w.votes != null ? w.votes : 0) || 0;
        const rVotes = Number(r && r.votes != null ? r.votes : 0) || 0;
        const movVotes = (w && r) ? Math.max(0, wVotes - rVotes) : null;
        const wShare = Number(w && w.share_pp != null ? w.share_pp : null);
        const rShare = Number(r && r.share_pp != null ? r.share_pp : null);
        const movPp = (w && r && Number.isFinite(wShare) && Number.isFinite(rShare))
          ? (wShare - rShare)
          : ((w && r && Number(row.const_total_votes || 0)) ? ((wVotes - rVotes) / Number(row.const_total_votes || 1) * 100.0) : null);
        const key = `${cParty}|||${pParty}`;
        if (!idx[key]) idx[key] = [];
        idx[key].push({
          distId,
          label: `${row.province || ''} เขต ${row.district || ''}`.trim(),
          cand: (w && w.candidate) ? String(w.candidate) : '—',
          mov_pp: Number.isFinite(movPp) ? movPp : null,
          mov_votes: (movVotes != null && Number.isFinite(Number(movVotes))) ? Number(movVotes) : null,
        });
      });
      distIndexByPair = idx;
    })();

    const postSelectDist = (distId) => {
      if (!distId) return;
      try { window.parent.postMessage({ type: 'select-dist', distId }, '*'); } catch (e) {}
    };
    const popupEl = document.getElementById('popup');
    const popupTitleEl = document.getElementById('popupTitle');
    const popupSubEl = document.getElementById('popupSub');
    const popupBodyEl = document.getElementById('popupBody');
    const popupCloseEl = document.getElementById('popupClose');
    const closePopup = () => { if (popupEl) popupEl.classList.remove('show'); };
    if (popupCloseEl) popupCloseEl.addEventListener('click', closePopup);
    if (popupEl) popupEl.addEventListener('click', (e) => { if (e && e.target === popupEl) closePopup(); });

    const showPopup = (cParty, pParty, count) => {
      if (!popupEl || !popupTitleEl || !popupSubEl || !popupBodyEl) return;
      const t = (LANG_TEXT[currentLang] || LANG_TEXT.th);
      popupTitleEl.textContent = `${t.y}: ${translateParty(cParty, currentLang)} · ${t.x}: ${translateParty(pParty, currentLang)}`;
      popupSubEl.textContent = `${t.cb}: ${toIntText(count || 0)} — click a row to jump to map`;
      const items = (distIndexByPair[`${cParty}|||${pParty}`] || []).slice()
        .sort((a, b) => String(a.label).localeCompare(String(b.label), 'th'));
      popupBodyEl.innerHTML = items.length
        ? items.map((r) => {
          const pp = (r.mov_pp != null) ? `${r.mov_pp >= 0 ? '+' : ''}${Number(r.mov_pp).toFixed(1)}pp` : '—';
          const vv = (r.mov_votes != null) ? ` (${Number(r.mov_votes).toLocaleString()} votes)` : '';
          return `<div class="row" data-dist="${r.distId}"><div>${r.label}</div><div class="mono">${r.cand} · ${pp}${vv}</div></div>`;
        }).join('')
        : `<div class="row" style="cursor:default;"><div>No constituencies in this cell.</div></div>`;
      popupBodyEl.querySelectorAll('.row[data-dist]').forEach((row) => {
        row.addEventListener('click', () => {
          const did = row.getAttribute('data-dist');
          postSelectDist(did);
          closePopup();
        });
      });
      popupEl.classList.add('show');
    };

    const chartEl = document.getElementById('chart');
    if (chartEl) {
      chartEl.on('plotly_click', (ev) => {
        const pt = ev && ev.points && ev.points[0];
        const pn = pt && pt.pointNumber;
        const z = pt && (pt.z != null ? pt.z : null);
        const rowIdx = Array.isArray(pn) ? pn[0] : null;
        const colIdx = Array.isArray(pn) ? pn[1] : null;
        if (rowIdx == null || colIdx == null) return;
        const cParty = baseY[rowIdx];
        const pParty = baseX[colIdx];
        if (!cParty || !pParty) return;
        showPopup(cParty, pParty, z);
      });
    }

    window.addEventListener('message', (event) => {
      if (event && event.data && event.data.type === 'set-lang') {
        applyLang(event.data.lang || 'th');
      }
    });

</script>
</body>
</html>
