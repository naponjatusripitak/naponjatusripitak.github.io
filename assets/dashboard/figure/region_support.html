    .toggle button.active { border-color:#111827; color:#111827; }

      .toggle { flex-wrap: wrap; }

    const layout = {"barmode": "group", "margin": {"l": 50, "r": 20, "t": 40, "b": 40}, "xaxis": {"title": "", "tickangle": 0, "tickfont": {"size": 12}}, "yaxis": {"title": "สัดส่วนคะแนน (%)", "rangemode": "tozero", "tickfont": {"size": 12}}, "legend": {"orientation": "h", "y": -0.25}, "autosize": true, "title": {"text": "สัดส่วนคะแนนรายภาค (แบ่งเขต)", "x": 0.01, "font": {"size": 16}}};

    
    const isMobile = (window.innerWidth || document.documentElement.clientWidth) <= 720;
    if (isMobile) {
      layout.xaxis.tickangle = -45;
      layout.xaxis.tickfont = {size: 11};
      layout.yaxis.tickfont = {size: 11};
      layout.margin.b = 50;
    }

    
    function applyResponsiveLayout() {
      const w = window.innerWidth || document.documentElement.clientWidth;
      if (w <= 720) {
        layout.xaxis.tickangle = -45;
        layout.xaxis.tickfont = {size: 11};
        layout.yaxis.tickfont = {size: 11};
        layout.margin.b = 140;
        layout.legend.y = -0.35;
      } else {
        layout.xaxis.tickangle = 0;
        layout.xaxis.tickfont = {size: 12};
        layout.yaxis.tickfont = {size: 12};
        layout.margin.b = 40;
        layout.legend.y = -0.25;
      }
    }
    function applyHeight() {
      const wrap = document.getElementById('wrap');
      const chartEl = document.getElementById('chart');
      const toggle = document.querySelector('.toggle');
      if (!wrap || !chartEl) return;
      const totalH = wrap.getBoundingClientRect().height || window.innerHeight;
      const offset = toggle ? toggle.getBoundingClientRect().height + 8 : 0;
      const chartH = Math.max(260, totalH - offset);
      chartEl.style.height = `${chartH}px`;
    }
    applyResponsiveLayout();
    applyHeight();

    const btnConst = document.getElementById('btn-const');
    const btnList = document.getElementById('btn-list');

    const LANG_TEXT = {
      th: {
        constBtn: 'แบ่งเขต',
        listBtn: 'บัญชีรายชื่อ',
        titleConst: 'สัดส่วนคะแนนรายภาค (แบ่งเขต)',
        titleList: 'สัดส่วนคะแนนรายภาค (บัญชีรายชื่อ)',
        xAxis: '',
        yAxis: 'สัดส่วนคะแนน (%)'
      },
      en: {
        constBtn: 'Constituency',
        listBtn: 'Party List',
        titleConst: 'Regional Vote Share (Constituency)',
        titleList: 'Regional Vote Share (Party List)',
        xAxis: '',
        yAxis: 'Vote Share (%)'
      }
    };
    const PARTY_NAME_EN = {
      'ก้าวไกล': 'Move Forward',
      'เพื่อไทย': 'Pheu Thai',
      'ภูมิใจไทย': 'Bhumjaithai',
      'พลังประชารัฐ': 'Palang Pracharath',
      'รวมไทยสร้างชาติ': 'United Thai Nation',
      'ประชาธิปัตย์': 'Democrat'
    };
    const REGION_NAME_EN = {
      'กรุงเทพมหานคร': 'Bangkok',
      'ภาคกลาง': 'Central',
      'ภาคเหนือ': 'North',
      'ภาคตะวันออกเฉียงเหนือ': 'Northeast',
      'ภาคใต้': 'South'
    };
    let currentLang = (localStorage.getItem('lang') || 'th');

    const translateParty = (name, lang) => {
      if (lang === 'en') return PARTY_NAME_EN[name] || name;
      return name;
    };
    const translateRegion = (name, lang) => {
      if (lang === 'en') return REGION_NAME_EN[name] || name;
      return name;
    };
    const buildTraces = (baseTraces, lang) => {
      const copy = JSON.parse(JSON.stringify(baseTraces));
      return copy.map((trace) => ({
        ...trace,
        name: translateParty(trace.name, lang),
        x: (trace.x || []).map((r) => translateRegion(r, lang))
      }));
    };

    const applyLang = (lang) => {
      currentLang = lang;
      try { localStorage.setItem('lang', lang); } catch (err) {}
      const t = LANG_TEXT[lang] || LANG_TEXT.th;
      btnConst.textContent = t.constBtn;
      btnList.textContent = t.listBtn;
      layout.xaxis.title = t.xAxis;
      layout.yaxis.title = t.yAxis;
      const isConstActive = btnConst.classList.contains('active');
      layout.title.text = isConstActive ? t.titleConst : t.titleList;
      const nextTraces = isConstActive ? buildTraces(tracesConst, lang) : buildTraces(tracesList, lang);
      Plotly.react(chart, nextTraces, layout, {displayModeBar:false, responsive:true});
    };

    const chart = document.getElementById('chart');
    Plotly.newPlot(chart, tracesConst, layout, {displayModeBar:false, responsive:true});
    setTimeout(() => Plotly.Plots.resize(chart), 50);
    const handleResize = () => {
      applyResponsiveLayout();
      applyHeight();
      Plotly.Plots.resize(chart);
    };
    window.addEventListener('resize', handleResize);
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => handleResize());
      ro.observe(document.getElementById('wrap'));
    }

    window.addEventListener('message', (event) => {
      if (event && event.data && event.data.type === 'region-resize') {
        handleResize();
      }
    });
    applyLang(currentLang);

    btnConst.addEventListener('click', () => {
      btnConst.classList.add('active');
      btnList.classList.remove('active');
      const t = LANG_TEXT[currentLang] || LANG_TEXT.th;
      layout.title.text = t.titleConst;
      Plotly.react(chart, buildTraces(tracesConst, currentLang), layout, {displayModeBar:false, responsive:true});
    });
    btnList.addEventListener('click', () => {
      btnList.classList.add('active');
      btnConst.classList.remove('active');
      const t = LANG_TEXT[currentLang] || LANG_TEXT.th;
      layout.title.text = t.titleList;
      Plotly.react(chart, buildTraces(tracesList, currentLang), layout, {displayModeBar:false, responsive:true});
    });
  
    window.addEventListener('message', (event) => {
      if (event && event.data && event.data.type === 'set-lang') {
        applyLang(event.data.lang || 'th');
      }
    });

</script>
</body>
</html>
