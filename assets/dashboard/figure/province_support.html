    function computeAll() {
      const provMap = dataMap[currentParty] || {};
      const entries = Object.keys(provMap).map(prov => {
        const v = provMap[prov];
        const val = mode === 'const' ? (v.vote_share_const || 0) : (v.vote_share_list || 0);
        return {prov, val};
      });
      entries.sort((a,b) => b.val - a.val);
      return entries;
    }

    const TITLE_TEXT = (party, modeName) => (LANG_TEXT[currentLang] || LANG_TEXT.th).title(party, modeName);
    
    function render() {
      const entries = computeAll();
      const y = entries.map(d => displayProvinceName(d.prov)).reverse();
      const x = entries.map(d => d.val).reverse();
      const color = colorMap[currentParty] || '#999';
      const title = TITLE_TEXT(displayPartyName(currentParty), mode);

        y, x,
        width: 0.6,
        marker: {color},

      }];

        xaxis: {title: X_AXIS_LABEL, rangemode: 'tozero'},
        yaxis: {automargin: true},
        height: dynamicHeight,
        bargap: 0.02,
        title: {text: title, x: 0.01, font: {size: 14}},
        font: {family: 'Sarabun, sans-serif', size: 12}
      };
      Plotly.react('chart', data, layout, {displayModeBar:false, responsive:true});
      const chartEl = document.getElementById('chart');

        chartEl.style.height = `${dynamicHeight}px`;
      }
      const extra = 64; // controls padding
      if (window.parent) {
        const targetHeight = (document.getElementById('wrap') ? document.getElementById('wrap').scrollHeight : dynamicHeight + extra);
        window.parent.postMessage({ type: 'resize-frame', id: 'province-support-frame', height: targetHeight }, '*');
        requestAnimationFrame(() => {
          window.parent.postMessage({ type: 'resize-frame', id: 'province-support-frame', height: targetHeight }, '*');
        });
        setTimeout(() => {
          window.parent.postMessage({ type: 'resize-frame', id: 'province-support-frame', height: targetHeight }, '*');
        }, 120);
      }
    }

    
    const notifyResize = () => {
      const wrap = document.getElementById('wrap');
      const height = wrap ? wrap.scrollHeight : document.body.scrollHeight;
      if (window.parent) {
        window.parent.postMessage({ type: 'resize-frame', id: 'province-support-frame', height }, '*');
      }
    };
    if (window.ResizeObserver) {
      const ro = new ResizeObserver(() => notifyResize());
      const wrap = document.getElementById('wrap');
      if (wrap) ro.observe(wrap);
    }
    window.addEventListener('resize', () => notifyResize());

const modeConst = document.getElementById('mode-const');
    const applyLang = (lang) => {
      currentLang = lang || currentLang;
      if (!['th','en'].includes(currentLang)) currentLang = 'th';
      modeConst.textContent = t('constBtn');
      modeList.textContent = t('listBtn');
      render();
    };
    const modeList = document.getElementById('mode-list');

    modeConst.addEventListener('click', () => {
      mode = 'const';

      modeList.classList.remove('active');

    });
    modeList.addEventListener('click', () => {
      mode = 'list';

      modeConst.classList.remove('active');
      render();
    });

      if (!event || !event.data) return;
      if (event.data.type === 'set-lang') {
        applyLang(event.data.lang);
        return;
      }
      if (event.data.type === 'set-party') {

          render();
        }
      }
    });

      render();
    }, 50);
    window.addEventListener('load', () => {
      setTimeout(render, 200);
    });
