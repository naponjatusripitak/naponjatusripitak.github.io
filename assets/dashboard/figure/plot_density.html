<script>
  const DEFAULT_PARTY = 'ก้าวไกล';
  const densityData = JSON.parse(document.getElementById('density-data').textContent);
  const rowsEl = document.getElementById('rows');
  const titleEl = document.getElementById('title');

  const fmt = (value) => new Intl.NumberFormat('th-TH').format(value);
  const fmtPct = (value) => value.toFixed(1) + '%';

  function buildBins(maxShare) {
    const safeMax = maxShare > 0 ? maxShare : 1;
    const step = safeMax / 5;
    const bins = [];
    for (let i = 0; i < 5; i++) {
      const min = step * i;
      const max = i === 4 ? step * (i + 1) + 1e-6 : step * (i + 1);
      const label = i === 0
        ? `<${max.toFixed(1)}%`
        : i === 4
          ? `>${min.toFixed(1)}%`
          : `${min.toFixed(1)}–${max.toFixed(1)}%`;
      bins.push({ min, max, label });
    }
    return bins;
  }

  function countInBin(values, bin) {
    return values.filter((v) => v >= bin.min && v < bin.max).length;
  }

  function computeHistogram(values, maxShare, binCount) {
    const safeMax = maxShare > 0 ? maxShare : 1;
    const step = safeMax / binCount;
    const counts = new Array(binCount).fill(0);
    const bins = [];
    for (let i = 0; i < binCount; i++) {
      const min = step * i;
      const max = i === binCount - 1 ? step * (i + 1) + 1e-6 : step * (i + 1);
      bins.push({ min, max, mid: (min + max) / 2 });
    }
    values.forEach((v) => {
      const idx = Math.min(binCount - 1, Math.floor(v / step));
      counts[idx] += 1;
    });
    return { counts, bins, step };
  }

  function renderChart(winners, losers, maxShare) {
    const binCount = 20;
    const histW = computeHistogram(winners, maxShare, binCount);
    const histL = computeHistogram(losers, maxShare, binCount);

    const x = histW.bins.map((b) => b.mid);
    const custom = histW.bins.map((b, i) => [b.min, b.max, histW.counts[i], histL.counts[i]]);

    const traceW = {
      x,
      y: histW.counts,
      type: 'bar',
      name: 'ผู้ชนะ',
      marker: { color: '#2f6df3' },
      opacity: 0.65,
      width: histW.step * 0.9,
      customdata: custom,
      hovertemplate: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้ชนะ: %{customdata[2]} เขต<extra></extra>'
    };
    const traceL = {
      x,
      y: histL.counts,
      type: 'bar',
      name: 'ผู้แพ้',
      marker: { color: '#e34747' },
      opacity: 0.55,
      width: histL.step * 0.9,
      customdata: custom,
      hovertemplate: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้แพ้: %{customdata[3]} เขต<extra></extra>'
    };

    const layout = {
      margin: { l: 50, r: 10, t: 30, b: 35 },
      paper_bgcolor: '#fff',
      plot_bgcolor: '#fff',
      barmode: 'overlay',
      xaxis: { title: 'สัดส่วนคะแนนบัญชีรายชื่อ (%)', range: [0, maxShare] },
      yaxis: { title: 'จำนวนเขต', rangemode: 'tozero' },
      legend: { orientation: 'h', x: 0, y: -0.25 }
    };
    Plotly.react('chart', [traceW, traceL], layout, { displayModeBar: false, responsive: true });
  }

  function buildTable(party) {
    const selected = party && densityData.parties[party] ? party : DEFAULT_PARTY;
    const data = densityData.parties[selected] || { winners: [], losers: [] };
    const winners = data.winners || [];
    const losers = data.losers || [];
    const allValues = [...winners, ...losers];
    const maxShare = allValues.length ? Math.max(...allValues) : 1;

      titleEl.textContent = `อัตราชนะการเลือกตั้งแบบแบ่งเขตตามสัดส่วนคะแนนบัญชีรายชื่อ (${selected})`;

    renderChart(winners, losers, maxShare);

    const bins = buildBins(maxShare);
    const rows = bins.map((bin) => {
      const winCount = countInBin(winners, bin);
      const loseCount = countInBin(losers, bin);
      const total = winCount + loseCount;
      const rate = total > 0 ? (winCount / total) * 100 : 0;
      return `
        <tr>
          <td>${bin.label}</td>
          <td class="num">${fmt(total)}</td>
          <td class="num">${fmt(winCount)}</td>
          <td class="num">${fmtPct(rate)}</td>
        </tr>
      `;
    }).join('');

    rowsEl.innerHTML = rows;
    postHeight();
  }

  window.addEventListener('message', (event) => {
    const payload = event.data || {};
    if (payload.type === 'party-select') {
      buildTable(payload.party);
    }
  });

  let lastPostedHeight = 0;
  const postHeight = () => {
    const height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
    if (Math.abs(height - lastPostedHeight) < 4) return;
    lastPostedHeight = height;
    if (window.parent) {
      window.parent.postMessage({ type: 'iframe-height', id: 'density-frame', height }, '*');
    }
  };

  window.addEventListener('load', () => {
    postHeight();
    setTimeout(postHeight, 250);
  });
  // Avoid resize feedback loops; let parent drive iframe height.

  buildTable(DEFAULT_PARTY);

  const LANG_TEXT = {
    th: {
      x: 'สัดส่วนคะแนนบัญชีรายชื่อ (%)',
      y: 'จำนวนเขต',
      title: 'อัตราชนะการเลือกตั้งแบบแบ่งเขตตามสัดส่วนคะแนนบัญชีรายชื่อ',
      bin: 'ช่วงคะแนน (ช่วงเท่ากัน)',
      count: 'จำนวนเขต',
      wins: 'ชนะ (เขต)',
      rate: 'อัตราชนะ',
      hoverWin: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้ชนะ: %{customdata[2]} เขต<extra></extra>',
      hoverLose: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้แพ้: %{customdata[3]} เขต<extra></extra>'
    },
    en: {
      x: 'Party-list Vote Share (%)',
      y: 'Constituencies',
      title: 'Constituency Win Rate by Party-list Vote Share',
      bin: 'Vote-share bin (equal width)',
      count: 'Constituencies',
      wins: 'Wins (const.)',
      rate: 'Win rate',
      hoverWin: 'Vote-share: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>Winners: %{customdata[2]}<extra></extra>',
      hoverLose: 'Vote-share: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>Losers: %{customdata[3]}<extra></extra>'
    }
  };
  let currentLang = 'th';
  const applyLang = (lang) => {
    currentLang = lang;
    const t = LANG_TEXT[lang] || LANG_TEXT.th;
    layout.xaxis.title = t.x;
    layout.yaxis.title = t.y;
    layout.title = {text: t.title, x: 0.01, font: {size: 14}};
    const hdrBin = document.getElementById('hdr-bin');
    const hdrCount = document.getElementById('hdr-count');
    const hdrWins = document.getElementById('hdr-wins');
    const hdrRate = document.getElementById('hdr-rate');
    if (hdrBin) hdrBin.textContent = t.bin;
    if (hdrCount) hdrCount.textContent = t.count;
    if (hdrWins) hdrWins.textContent = t.wins;
    if (hdrRate) hdrRate.textContent = t.rate;
    if (chartData[0]) chartData[0].hovertemplate = t.hoverWin;
    if (chartData[1]) chartData[1].hovertemplate = t.hoverLose;
    Plotly.react('chart', chartData, layout, {displayModeBar:false, responsive:true});
  };

  window.addEventListener('message', (event) => {
    if (event && event.data && event.data.type === 'set-lang') {
      applyLang(event.data.lang || 'th');
    }
  });

</script>
