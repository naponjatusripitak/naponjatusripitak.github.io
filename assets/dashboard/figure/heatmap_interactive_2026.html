<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script src="plotly.min.js"></script>
  <script src="../data/election_results_2569_by_dist.js"></script>
  <style>
    @font-face {
      font-family: 'Sarabun';
      src: url('../font/Sarabun/Sarabun-Regular.ttf') format('truetype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    html, body, #chart { margin: 0; padding: 0; width: 100%; height: 100%; background: #fff; }
    #popup {
      position: fixed;
      inset: 12px;
      display: none;
      z-index: 9999;
      background: rgba(255,255,255,0.96);
      border: 1px solid rgba(15,23,42,0.18);
      border-radius: 14px;
      box-shadow: 0 18px 48px rgba(15,23,42,0.22);
      font-family: Sarabun, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color: #0f172a;
      overflow: hidden;
    }
    #popup.show { display: grid; grid-template-rows: auto 1fr; }
    #popupHeader {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      padding: 12px 12px 10px;
      border-bottom: 1px solid rgba(15,23,42,0.10);
      background: #fff;
    }
    #popupTitle { font-weight: 900; font-size: 13px; line-height: 1.2; }
    #popupSub { font-size: 12px; color: #475569; margin-top: 2px; }
    #popupClose {
      margin-left: auto;
      border: 1px solid rgba(15,23,42,0.14);
      background: #fff;
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
      font-weight: 900;
      font-size: 12px;
      color: #0f172a;
    }
    #popupBody { overflow: auto; background: #fff; }
    #popupBody .row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(15,23,42,0.06);
      cursor: pointer;
    }
    #popupBody .row:hover { background: rgba(15,23,42,0.03); }
    #popupBody .mono { font-variant-numeric: tabular-nums; white-space: nowrap; color: #334155; }
  </style>
</head>
<body>
  <div id="chart"></div>
  <div id="popup" role="dialog" aria-modal="true" aria-label="Heatmap details">
    <div id="popupHeader">
      <div>
        <div id="popupTitle"></div>
        <div id="popupSub"></div>
      </div>
      <button id="popupClose" type="button">Close</button>
    </div>
    <div id="popupBody"></div>
  </div>
  <script>
    const LANG_TEXT = {
      th: {
        x: 'พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด',
        y: 'พรรคที่ชนะเขต',
        cb: 'จำนวนเขต',
        hover: 'พรรคที่ชนะเขต: %{y}<br>พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด: %{x}<br>จำนวนเขต: %{z}<extra></extra>',
      },
      en: {
        x: 'Top party-list winner',
        y: 'Constituency winner',
        cb: 'Constituencies',
        hover: 'Constituency winner: %{y}<br>Top party-list winner: %{x}<br>Constituencies: %{z}<extra></extra>',
      },
    };

    const FALLBACK_EN = {
      'ประชาชน': "People's Party",
      'เพื่อไทย': 'Pheu Thai',
      'ภูมิใจไทย': 'Bhumjaithai',
      'กล้าธรรม': 'Kla Tham',
      'ประชาธิปัตย์': 'Democrat',
      'ไทรวมพลัง': 'Thai Rumphalang Party',
      'ประชาชาติ': 'Prachachat',
      'พลังประชารัฐ': 'Palang Pracharath',
      'ไทยสร้างไทย': 'Thai Sang Thai',
      'โอกาสใหม่': 'New Opportunity',
    };

    const toIntText = (n) => String(Number(n || 0));
    const chooseTextColor = (value, maxValue) => (Number(value || 0) > Number(maxValue || 0) * 0.45 ? 'white' : 'black');

    let partyMapFromParent = {};
    let baseX = [];
    let baseY = [];
    let zMatrix = [];
    let textMatrix = [];
    let textColorMatrix = [];
    let currentLang = 'th';
    let distIndexByPair = {}; // "c|||p" -> [{distId,label,cand,mov_pp,mov_votes}]

    const translateParty = (name, lang) => {
      if (lang !== 'en') return name;
      return partyMapFromParent[name] || FALLBACK_EN[name] || name;
    };
    const shortPartyLabel = (name, lang) => {
      const full = translateParty(name, lang);
      if (lang !== 'en') return full;
      return full
        .replace(/\s+Party$/i, '')
        .replace(/^Thai Rumphalang/i, 'Thai Ruam Phalang')
        .replace(/^People's$/i, 'People');
    };

    const getInitLang = () => {
      try {
        const urlLang = new URLSearchParams(window.location.search).get('lang');
        const stored = localStorage.getItem('lang');
        const candidate = urlLang || stored || 'th';
        return candidate === 'en' ? 'en' : 'th';
      } catch (err) {
        return 'th';
      }
    };

    const buildHeatmapData = () => {
      const byDist = ((window.__electionResults2569 || {}).byDist) || {};
      const cross = {};
      const constWins = {};
      const listWins = {};
      const idx = {};

      Object.keys(byDist).forEach((distId) => {
        const row = byDist[distId] || {};
        const cParty = row.winner_const_party || '';
        const pParty = row.winner_plist_party || '';
        if (!cParty || !pParty) return;
        const cands = Array.isArray(row.const_candidates) ? row.const_candidates : [];
        const w = cands[0] || null;
        const r = cands[1] || null;
        const wVotes = Number(w && w.votes != null ? w.votes : 0) || 0;
        const rVotes = Number(r && r.votes != null ? r.votes : 0) || 0;
        const movVotes = (w && r) ? Math.max(0, wVotes - rVotes) : null;
        const wShare = Number(w && w.share_pp != null ? w.share_pp : null);
        const rShare = Number(r && r.share_pp != null ? r.share_pp : null);
        const movPp = (w && r && Number.isFinite(wShare) && Number.isFinite(rShare))
          ? (wShare - rShare)
          : ((w && r && Number(row.const_total_votes || 0)) ? ((wVotes - rVotes) / Number(row.const_total_votes || 1) * 100.0) : null);
        const key = `${cParty}|||${pParty}`;
        if (!idx[key]) idx[key] = [];
        idx[key].push({
          distId,
          label: `${row.province || ''} เขต ${row.district || ''}`.trim(),
          cand: (w && w.candidate) ? String(w.candidate) : '—',
          mov_pp: Number.isFinite(movPp) ? movPp : null,
          mov_votes: (movVotes != null && Number.isFinite(Number(movVotes))) ? Number(movVotes) : null,
        });
        constWins[cParty] = (constWins[cParty] || 0) + 1;
        listWins[pParty] = (listWins[pParty] || 0) + 1;
        if (!cross[cParty]) cross[cParty] = {};
        cross[cParty][pParty] = (cross[cParty][pParty] || 0) + 1;
      });

      distIndexByPair = idx;
      baseY = Object.entries(constWins)
        .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0], 'th'))
        .map(([party]) => party);

      baseX = Object.entries(listWins)
        .sort((a, b) => (b[1] - a[1]) || a[0].localeCompare(b[0], 'th'))
        .map(([party]) => party);

      zMatrix = baseY.map((cParty) => (
        baseX.map((pParty) => Number(((cross[cParty] || {})[pParty] || 0)))
      ));

      const maxValue = Math.max(0, ...zMatrix.flat());
      textMatrix = zMatrix.map((row) => row.map((v) => toIntText(v)));
      textColorMatrix = zMatrix.map((row) => row.map((v) => chooseTextColor(v, maxValue)));
    };

    const postSelectDist = (distId) => {
      if (!distId) return;
      try { window.parent.postMessage({ type: 'select-dist', distId }, '*'); } catch (e) {}
    };
    const popupEl = document.getElementById('popup');
    const popupTitleEl = document.getElementById('popupTitle');
    const popupSubEl = document.getElementById('popupSub');
    const popupBodyEl = document.getElementById('popupBody');
    const popupCloseEl = document.getElementById('popupClose');
    const closePopup = () => { if (popupEl) popupEl.classList.remove('show'); };
    if (popupCloseEl) popupCloseEl.addEventListener('click', closePopup);
    if (popupEl) popupEl.addEventListener('click', (e) => { if (e && e.target === popupEl) closePopup(); });

    const showPopup = (cParty, pParty, count) => {
      if (!popupEl || !popupTitleEl || !popupSubEl || !popupBodyEl) return;
      const t = LANG_TEXT[currentLang] || LANG_TEXT.th;
      const cLabel = translateParty(cParty, currentLang);
      const pLabel = translateParty(pParty, currentLang);
      popupTitleEl.textContent = `${t.y}: ${cLabel} · ${t.x}: ${pLabel}`;
      popupSubEl.textContent = `${t.cb}: ${toIntText(count || 0)} — click a row to jump to map`;

      const items = (distIndexByPair[`${cParty}|||${pParty}`] || []).slice()
        .sort((a, b) => String(a.label).localeCompare(String(b.label), 'th'));
      popupBodyEl.innerHTML = items.length
        ? items.map((r) => {
          const pp = (r.mov_pp != null) ? `${r.mov_pp >= 0 ? '+' : ''}${Number(r.mov_pp).toFixed(1)}pp` : '—';
          const vv = (r.mov_votes != null) ? ` (${Number(r.mov_votes).toLocaleString()} votes)` : '';
          return `<div class="row" data-dist="${r.distId}"><div>${r.label}</div><div class="mono">${r.cand} · ${pp}${vv}</div></div>`;
        }).join('')
        : `<div class="row" style="cursor:default;"><div>No constituencies in this cell.</div></div>`;

      popupBodyEl.querySelectorAll('.row[data-dist]').forEach((row) => {
        row.addEventListener('click', () => {
          const did = row.getAttribute('data-dist');
          postSelectDist(did);
          closePopup();
        });
      });
      popupEl.classList.add('show');
    };

    const heatTrace = {
      type: 'heatmap',
      z: [],
      x: [],
      y: [],
      colorscale: [
        [0.0, '#fff5f0'],
        [0.125, '#fee0d2'],
        [0.25, '#fcbba1'],
        [0.375, '#fc9272'],
        [0.5, '#fb6a4a'],
        [0.625, '#ef3b2c'],
        [0.75, '#cb181d'],
        [1.0, '#99000d'],
      ],
      zmin: 0,
      showscale: true,
      colorbar: { title: { text: 'จำนวนเขต', side: 'right' } },
      text: [],
      texttemplate: '%{text}',
      textfont: { color: [], size: 12 },
      hovertemplate: '',
      xgap: 1,
      ygap: 1,
    };

    const layout = {
      margin: { l: 140, r: 30, t: 40, b: 140 },
      xaxis: { title: 'พรรคที่ได้คะแนนบัญชีรายชื่อสูงสุด', tickangle: 45, tickfont: { size: 12 }, automargin: true },
      yaxis: { title: 'พรรคที่ชนะเขต', tickangle: 0, tickfont: { size: 12 }, autorange: 'reversed', automargin: true },
      height: 720,
      dragmode: false,
      paper_bgcolor: '#ffffff',
      plot_bgcolor: '#ffffff',
      font: { family: 'Sarabun, Arial, sans-serif', size: 12 },
    };
    const config = {
      displayModeBar: false,
      responsive: true,
      scrollZoom: false,
      doubleClick: false,
      showAxisDragHandles: false,
      showAxisRangeEntryBoxes: false,
    };
    const applyResponsiveLayout = () => {
      const w = window.innerWidth || 1200;
      if (w <= 900) {
        const mobile = true;
        heatTrace.showscale = false;
        layout.margin = { l: 68, r: 0, t: 12, b: 86 };
        layout.xaxis.tickangle = 40;
        layout.xaxis.tickfont = { size: 10 };
        layout.yaxis.tickfont = { size: 10 };
        layout.xaxis.title = '';
        layout.yaxis.title = '';
        layout.height = 640;
        layout.xaxis.fixedrange = true;
        layout.yaxis.fixedrange = true;
      } else {
        const mobile = false;
        heatTrace.showscale = true;
        layout.margin = { l: 140, r: 30, t: 40, b: 140 };
        layout.xaxis.tickangle = 45;
        layout.xaxis.tickfont = { size: 12 };
        layout.yaxis.tickfont = { size: 12 };
        layout.height = 720;
        layout.xaxis.fixedrange = true;
        layout.yaxis.fixedrange = true;
      }
    };

    const applyLang = (lang) => {
      currentLang = lang === 'en' ? 'en' : 'th';
      const t = LANG_TEXT[currentLang] || LANG_TEXT.th;

      const mobile = (window.innerWidth || 1200) <= 900;
      heatTrace.x = baseX.map((p) => mobile ? shortPartyLabel(p, currentLang) : translateParty(p, currentLang));
      heatTrace.y = baseY.map((p) => mobile ? shortPartyLabel(p, currentLang) : translateParty(p, currentLang));
      heatTrace.z = zMatrix;
      heatTrace.text = textMatrix;
      heatTrace.textfont = { color: textColorMatrix, size: 12 };
      heatTrace.hovertemplate = t.hover;
      if (heatTrace.colorbar && heatTrace.colorbar.title) heatTrace.colorbar.title.text = t.cb;

      layout.xaxis.title = mobile ? '' : t.x;
      layout.yaxis.title = mobile ? '' : t.y;
      applyResponsiveLayout();

      Plotly.react('chart', [heatTrace], layout, config);
    };

    buildHeatmapData();
    currentLang = getInitLang();
    Plotly.newPlot('chart', [heatTrace], layout, config);
    applyLang(currentLang);

    const chartEl = document.getElementById('chart');
    const onChartClick = (ev) => {
        const pt = ev && ev.points && ev.points[0];
        const pn = pt && pt.pointNumber;
        const z = pt && (pt.z != null ? pt.z : null);
        const rowIdx = Array.isArray(pn) ? pn[0] : null;
        const colIdx = Array.isArray(pn) ? pn[1] : null;
        if (rowIdx == null || colIdx == null) return;
        const cParty = baseY[rowIdx];
        const pParty = baseX[colIdx];
        if (!cParty || !pParty) return;
        showPopup(cParty, pParty, z);
    };
    const bindClickHandler = () => {
      if (!chartEl || typeof chartEl.on !== 'function') return;
      if (typeof chartEl.removeAllListeners === 'function') {
        chartEl.removeAllListeners('plotly_click');
      }
      chartEl.on('plotly_click', onChartClick);
    };
    if (chartEl) {
      bindClickHandler();
    }

    window.addEventListener('resize', () => {
      applyLang(currentLang);
      bindClickHandler();
    });
    window.addEventListener('message', (event) => {
      if (!event || !event.data || event.data.type !== 'set-lang') return;
      if (event.data.partyMap && typeof event.data.partyMap === 'object') {
        partyMapFromParent = event.data.partyMap;
      }
      applyLang(event.data.lang || currentLang || 'th');
      bindClickHandler();
    });
  </script>
</body>
</html>
