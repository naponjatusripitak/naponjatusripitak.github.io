<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="plotly.min.js"></script>
  <script src="../data/election_results_2569_by_dist.js"></script>
  <script src="../data/party_assets_2569/party_name_map_2569.js"></script>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #fff; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    .wrap { height: 100%; display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 22px; box-sizing: border-box; }
    .card { width: 100%; border: 1px solid #e2e6ea; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .title { background: #1f3a4d; color: #fff; padding: 10px 14px; font-weight: 700; font-size: 14px; }
    #chart { width: 100%; height: 380px; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th { background: #24485f; color: #fff; padding: 10px 8px; text-align: center; }
    tbody td { padding: 10px 8px; border-top: 1px solid #e6ebef; text-align: center; }
    tbody tr:nth-child(odd) { background: #f7fbff; }
    .num { font-variant-numeric: tabular-nums; }
    @media (max-width: 720px) {
      .wrap { padding: 4px; gap: 14px; padding-bottom: 14px; }
      .card { border-radius: 10px; }
      .title { padding: 8px 10px; }
      thead th { padding: 8px 6px; }
      tbody td { padding: 8px 6px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <div class="title" id="title">Win Rate by Party-list Vote Share</div>
      <div id="chart"></div>
    </div>
    <div class="card">
      <table>
        <thead>
          <tr>
            <th id="hdr-bin">ช่วงคะแนน (ช่วงเท่ากัน)</th>
            <th id="hdr-count">จำนวนเขต</th>
            <th id="hdr-wins">ชนะ (เขต)</th>
            <th id="hdr-rate">อัตราชนะ</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </div>

<script>
  const DEFAULT_PARTY = 'ภูมิใจไทย';
  const ALIASES_2026 = {
    'ก้าวไกล': 'ประชาชน',
    'เพื่อไทรวมพลัง': 'ไทรวมพลัง',
  };
  const FALLBACK_EN = {
    'ประชาชน': "People's Party",
    'ไทรวมพลัง': 'Thai Rumphalang Party',
  };
  const byDist = (window.__electionResults2569 && window.__electionResults2569.byDist) || {};
  const rowsEl = document.getElementById('rows');
  const titleEl = document.getElementById('title');
  let partyNameMapFromParent = {};
  let partyNameMapEn = {
    ...(window.PARTY_NAME_MAP_2569 || {}),
    ...FALLBACK_EN,
  };

  let currentParty = DEFAULT_PARTY;
  let currentLang = (new URLSearchParams(location.search).get('lang') || localStorage.getItem('lang') || localStorage.getItem('dashboardLang') || 'th');
  let chartData = [];
  let layout = {};
  let densityData = { parties: {} };

  const resolvePartyAlias = (party) => ALIASES_2026[party] || party;
  const displayPartyName = (party) => {
    if (currentLang === 'en') return partyNameMapFromParent[party] || partyNameMapEn[party] || party;
    return party;
  };
  const getFormatter = () => new Intl.NumberFormat(currentLang === 'en' ? 'en-US' : 'th-TH');
  const fmt = (value) => getFormatter().format(value);
  const fmtPct = (value) => value.toFixed(1) + '%';

  function buildDensityData() {
    const parties = {};
    Object.keys(byDist).forEach((distId) => {
      const dist = byDist[distId] || {};
      const winner = dist.winner_const_party || '';
      const plist = Array.isArray(dist.plist_parties) ? dist.plist_parties : [];
      plist.forEach((row) => {
        if (!row || !row.party) return;
        const party = row.party;
        const share = Number(row.plist_pp || 0);
        if (!Number.isFinite(share)) return;
        if (!parties[party]) parties[party] = { winners: [], losers: [] };
        if (party === winner) parties[party].winners.push(share);
        else parties[party].losers.push(share);
      });
    });
    densityData = { parties };
  }

  function buildBins(maxShare) {
    const safeMax = maxShare > 0 ? maxShare : 1;
    const step = safeMax / 5;
    const bins = [];
    for (let i = 0; i < 5; i++) {
      const min = step * i;
      const max = i === 4 ? step * (i + 1) + 1e-6 : step * (i + 1);
      const label = i === 0
        ? `<${max.toFixed(1)}%`
        : i === 4
          ? `>${min.toFixed(1)}%`
          : `${min.toFixed(1)}–${max.toFixed(1)}%`;
      bins.push({ min, max, label });
    }
    return bins;
  }

  function countInBin(values, bin) {
    return values.filter((v) => v >= bin.min && v < bin.max).length;
  }

  function computeHistogram(values, maxShare, binCount) {
    const safeMax = maxShare > 0 ? maxShare : 1;
    const step = safeMax / binCount;
    const counts = new Array(binCount).fill(0);
    const bins = [];
    for (let i = 0; i < binCount; i++) {
      const min = step * i;
      const max = i === binCount - 1 ? step * (i + 1) + 1e-6 : step * (i + 1);
      bins.push({ min, max, mid: (min + max) / 2 });
    }
    values.forEach((v) => {
      const idx = Math.min(binCount - 1, Math.floor(v / step));
      counts[idx] += 1;
    });
    return { counts, bins, step };
  }

  function renderChart(winners, losers, maxShare) {
    const t = LANG_TEXT[currentLang] || LANG_TEXT.th;
    const binCount = 20;
    const histW = computeHistogram(winners, maxShare, binCount);
    const histL = computeHistogram(losers, maxShare, binCount);

    const x = histW.bins.map((b) => b.mid);
    const custom = histW.bins.map((b, i) => [b.min, b.max, histW.counts[i], histL.counts[i]]);

    const traceW = {
      x,
      y: histW.counts,
      type: 'bar',
      name: t.legendWin,
      marker: { color: '#2f6df3' },
      opacity: 0.65,
      width: histW.step * 0.9,
      customdata: custom,
      hovertemplate: t.hoverWin
    };
    const traceL = {
      x,
      y: histL.counts,
      type: 'bar',
      name: t.legendLose,
      marker: { color: '#e34747' },
      opacity: 0.55,
      width: histL.step * 0.9,
      customdata: custom,
      hovertemplate: t.hoverLose
    };

    layout = {
      margin: { l: 50, r: 10, t: 30, b: 35 },
      paper_bgcolor: '#fff',
      plot_bgcolor: '#fff',
      barmode: 'overlay',
      xaxis: { title: t.x, range: [0, maxShare] },
      yaxis: { title: t.y, rangemode: 'tozero' },
      legend: { orientation: 'h', x: 0, y: -0.25 }
    };
    chartData = [traceW, traceL];
    Plotly.react('chart', chartData, layout, { displayModeBar: false, responsive: true });
  }

  function buildTable(party) {
    const requested = resolvePartyAlias(party || '');
    const fallback = densityData.parties[DEFAULT_PARTY] ? DEFAULT_PARTY : (Object.keys(densityData.parties)[0] || DEFAULT_PARTY);
    const selected = requested && densityData.parties[requested] ? requested : fallback;
    currentParty = selected;
    const data = densityData.parties[selected] || { winners: [], losers: [] };
    const winners = data.winners || [];
    const losers = data.losers || [];
    const allValues = [...winners, ...losers];
    const maxShare = allValues.length ? Math.max(...allValues) : 1;

    const t = LANG_TEXT[currentLang] || LANG_TEXT.th;
    titleEl.textContent = `${t.title}: ${displayPartyName(selected)}`;

    renderChart(winners, losers, maxShare);

    const bins = buildBins(maxShare);
    const rows = bins.map((bin) => {
      const winCount = countInBin(winners, bin);
      const loseCount = countInBin(losers, bin);
      const total = winCount + loseCount;
      const rate = total > 0 ? (winCount / total) * 100 : 0;
      return `
        <tr>
          <td>${bin.label}</td>
          <td class="num">${fmt(total)}</td>
          <td class="num">${fmt(winCount)}</td>
          <td class="num">${fmtPct(rate)}</td>
        </tr>
      `;
    }).join('');

    rowsEl.innerHTML = rows;
    postHeight();
  }

  window.addEventListener('message', (event) => {
    const payload = event.data || {};
    if (payload.type === 'party-select') {
      buildTable(payload.party);
      return;
    }
    if (payload.type === 'set-lang') {
      currentLang = payload.lang === 'en' ? 'en' : 'th';
      if (payload.partyMap && typeof payload.partyMap === 'object') partyNameMapFromParent = payload.partyMap;
      applyLang(currentLang);
    }
  });

  let lastPostedHeight = 0;
  const postHeight = () => {
    const height = Math.max(
      document.body.scrollHeight,
      document.documentElement.scrollHeight
    );
    if (Math.abs(height - lastPostedHeight) < 4) return;
    lastPostedHeight = height;
    if (window.parent) {
      window.parent.postMessage({ type: 'iframe-height', id: 'density-frame', height }, '*');
    }
  };

  window.addEventListener('load', () => {
    postHeight();
    setTimeout(postHeight, 250);
  });

  const LANG_TEXT = {
    th: {
      x: 'สัดส่วนคะแนนบัญชีรายชื่อ (%)',
      y: 'จำนวนเขต',
      title: 'อัตราชนะการเลือกตั้งแบบแบ่งเขตตามสัดส่วนคะแนนบัญชีรายชื่อ',
      bin: 'สัดส่วนคะแนน',
      count: 'จำนวนเขต',
      wins: 'ชนะ (เขต)',
      rate: 'อัตราชนะ',
      legendWin: 'ผู้ชนะ',
      legendLose: 'ผู้แพ้',
      hoverWin: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้ชนะ: %{customdata[2]} เขต<extra></extra>',
      hoverLose: 'ช่วงคะแนน: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>ผู้แพ้: %{customdata[3]} เขต<extra></extra>'
    },
    en: {
      x: 'Party-list Vote Share (%)',
      y: 'Constituencies',
      title: 'Constituency Win Rate by Party-list Vote Share',
      bin: 'Vote share',
      count: 'Constituencies',
      wins: 'Wins (const.)',
      rate: 'Win rate',
      legendWin: 'Winners',
      legendLose: 'Losers',
      hoverWin: 'Vote-share: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>Winners: %{customdata[2]}<extra></extra>',
      hoverLose: 'Vote-share: %{customdata[0]:.1f}–%{customdata[1]:.1f}%<br>Losers: %{customdata[3]}<extra></extra>'
    }
  };

  const applyLang = (lang) => {
    currentLang = lang;
    const t = LANG_TEXT[lang] || LANG_TEXT.th;
    const hdrBin = document.getElementById('hdr-bin');
    const hdrCount = document.getElementById('hdr-count');
    const hdrWins = document.getElementById('hdr-wins');
    const hdrRate = document.getElementById('hdr-rate');
    if (hdrBin) hdrBin.textContent = t.bin;
    if (hdrCount) hdrCount.textContent = t.count;
    if (hdrWins) hdrWins.textContent = t.wins;
    if (hdrRate) hdrRate.textContent = t.rate;
    buildTable(currentParty);
  };

  buildDensityData();
  applyLang(currentLang);
</script>
</body>
</html>
